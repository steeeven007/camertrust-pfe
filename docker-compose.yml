version: "..."

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: camertrust
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: camertrust
    ports:
      - "5432:5432"
    volumes:
      - camertrust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camertrust"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://camertrust:secret@db:5432/camertrust
      SECRET_KEY: ${SECRET_KEY:-change-moi-avec-une-cle-longue-et-aleatoire}
      DEMO_USERNAME: ${DEMO_USERNAME:-camertrust}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-changeme123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  camertrust_pgdata:
